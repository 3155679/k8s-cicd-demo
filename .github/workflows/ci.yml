name: Build and Deploy to K3s

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t 192.168.25.31/demo/demo-app:${{ github.sha }} .

      - name: Push to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login 192.168.25.31 -u admin --password-stdin
          docker push 192.168.25.31/demo/demo-app:${{ github.sha }}

      - name: Deploy to K3s
        run: |
          kubectl set image deployment/demo-app demo-app=192.168.25.31/demo/demo-app:${{ github.sha }} -n default
